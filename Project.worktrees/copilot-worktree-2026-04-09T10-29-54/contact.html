<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Jewelry - Liên hệ</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">
    <header>
        <nav class=" navbar">
            <div class="logo">
                <img src="picture/9e34cae4-4747-4e1a-8e1a-92f9b9700e99.jpg" alt="">
            </div>
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">☰</label>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="search-cart">
                <input type="text" placeholder="Search...">
                <a href="cart.html" class="cart"><i class="fas fa-shopping-cart"></i></a>
            </div>
        </nav>

    </header>
    <main class="contact-page">
        <h1>Liên hệ</h1>
        <form id="contact-form" class="contact-form">
            <label>Họ tên:
                <input type="text" id="contact-name" name="name" required>
            </label>
            <label>Email:
                <input type="email" id="contact-email" name="email" required>
            </label>
            <label>Số điện thoại:
                <input type="tel" id="contact-phone" name="phone" required>
            </label>
            <label>Nội dung:
                <textarea id="contact-message" name="message" required></textarea>
            </label>
            <button type="submit">Gửi</button>
            <div id="contact-status" class="form-status"></div>
        </form>
    </main>
    <footer class="site-footer">
        <div class="site-footer__content">
            <div class="site-footer__section">
                <h3>Contact Us</h3>
                <p>123 Jewelry Street, Hanoi, Vietnam</p>
                <p>Email: support@tinjewelry.com</p>
                <p>Phone: +84 123 456 789</p>
            </div>
            <div class="site-footer__section">
                <h3>Our Location</h3>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.1234567890123!2d105.834
                    16031500000!3d21.0277633!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab81c6a5
                    a1fb%3A0x0!2zMjEgVHJ1biBTb2kgVGnDqm4!5e0!3m2!1sen!2s!4v0000000000000" width="300" height="200"
                    style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <div class="site-footer__section">
                <h3>Follow Us</h3>
                <a href="#" class="site-footer__link"><i class="fab fa-facebook-f"></i> Facebook</a> |
                <a href="#" class="site-footer__link"><i class="fab fa-instagram"></i> Instagram</a> |
                <a href="#" class="site-footer__link"><i class="fab fa-youtube"></i> YouTube</a>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
